# Agente FX: walk-forward con costos reales sobre las velas de la rama fx-data → data/fx/{BACKTEST.md,
# backtest.json, model.json} en fx-agente. El motor en el VPS descarga model.json de aquí (FX_MODEL_URL).
# Corre al cambiar fx/** en fx-agente, con [fx-backtest] en el mensaje, al terminar fx-data o a mano.
name: fx-backtest
on:
  workflow_dispatch:
  push:
    branches: [fx-agente]
    paths: ["fx/**", "tests/test_fx.py", ".github/workflows/fx-backtest.yml"]
permissions:
  contents: write
concurrency:
  group: fx-backtest
  cancel-in-progress: false
jobs:
  run:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[no-bt]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fx-agente
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r fx/requirements.txt
      - name: Pruebas (si fallan no se publica modelo)
        run: |
          python -m tests.test_fx > /tmp/t.txt 2>&1 || true
          grep -v "^✔" /tmp/t.txt | tail -15
          tail -1 /tmp/t.txt | grep -q " OK$"
      - name: Velas desde fx-data
        run: |
          mkdir -p bars
          git fetch -q --depth 1 origin fx-data
          git archive FETCH_HEAD bars | tar -x
          ls bars | head; du -sh bars
      - uses: actions/cache@v4
        with:
          path: .cache/fx
          key: fx-events-${{ hashFiles('fx/events.py', 'fx/config.py', 'fx/calendar.py', 'fx/backtest.py') }}-${{ github.run_id }}
          restore-keys: fx-events-${{ hashFiles('fx/events.py', 'fx/config.py', 'fx/calendar.py', 'fx/backtest.py') }}-
      - run: python -m fx backtest --bars bars
      - name: Publicar resultados en fx-agente
        if: success()
        run: |
          git config user.name "fx-agente-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fx
          git diff --cached --quiet && exit 0
          git commit -q -m "fx: backtest $(date -u +%FT%TZ) [skip render] [no-bt]"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs origin fx-agente && git push -q origin HEAD:fx-agente && exit 0
            git rebase --abort 2>/dev/null; sleep $((i * 15))
          done
          exit 1
