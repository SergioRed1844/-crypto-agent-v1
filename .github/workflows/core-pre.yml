# Foto del premarket (cartera, futuros, cripto, Bitso, pumps). Corre con [pre-run].
name: core-pre
on:
  workflow_dispatch:
  push:
    branches: [rebotes]
permissions:
  contents: write
concurrency:
  group: core-pre
  cancel-in-progress: false
jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pre-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pandas numpy requests yfinance
      - run: python -m core.pre out/pre
      - name: Publicar
        run: bash .github/scripts/rb_store_push.sh out "pre - $(date -u +%FT%TZ)"
