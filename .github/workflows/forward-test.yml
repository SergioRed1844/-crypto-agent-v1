# Prueba hacia adelante en PAPEL de CryptoAgent v4.1 (sin dinero, sin keys).
# Corre cada hora hasta el corte final (2026-10-14 20:00 UTC = 14:00 Monterrey) y guarda
# los resultados en la rama forward-test. Después del corte el script ya no descarga nada.
name: forward-test
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [forward-test]
permissions:
  contents: write
concurrency:
  group: forward-test
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forward-test
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Simular en papel (8 monedas x 3 escalas)
        run: node forward/run_forward.js
      - name: Guardar resultados en la rama forward-test
        run: |
          git config user.name "cryptoagent-forward-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forward/results
          if ! git diff --cached --quiet; then
            git commit -m "forward: resultados $(date -u +%FT%TZ)"
            git pull --rebase origin forward-test
            git push origin HEAD:forward-test
          fi
