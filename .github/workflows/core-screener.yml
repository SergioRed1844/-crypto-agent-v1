# Filtro de criptos chicas con patrón tipo DODO + estudio histórico + BTC semanal. Corre con [screener-run].
name: core-screener
on:
  workflow_dispatch:
  push:
    branches: [rebotes]
permissions:
  contents: write
concurrency:
  group: core-screener
  cancel-in-progress: false
jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screener-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pandas numpy requests pytest
      - run: python -m pytest -q tests/test_core_screener.py
      - run: python -m core.screener_cripto out/screener
      - name: Publicar
        run: bash .github/scripts/rb_store_push.sh out "screener - $(date -u +%FT%TZ)"
