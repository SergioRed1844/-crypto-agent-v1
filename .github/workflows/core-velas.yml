# Velas de una cripto y subidas fuertes. Corre con [velas-run].
name: core-velas
on:
  workflow_dispatch:
  push:
    branches: [rebotes]
permissions:
  contents: write
concurrency:
  group: core-velas
  cancel-in-progress: false
jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[velas-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pandas numpy requests
      - run: python -m core.velas_cripto out/velas DODOUSDT dodo
      - name: Publicar
        run: bash .github/scripts/rb_store_push.sh out "velas - $(date -u +%FT%TZ)"
