# Prueba en PAPEL de v4.2 hacia adelante: swing BTC/ETH/SOL, portafolio A (reglas v4.1) vs B (v4.2 completo).
# Cada hora decide las velas 4H que cerraron, maneja salidas con velas 1H y guarda todo en data/paper/.
# Dinero hipotético: no hay keys de exchange ni órdenes reales. Avisa por issue al 1er, 10º, 20º y 30º trade.
name: paper-v42
on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:
  push:
    branches: [v4.2-contexto]
permissions:
  contents: write
  issues: write
concurrency:
  group: paper-v42
  cancel-in-progress: false
jobs:
  run:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[paper]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4.2-contexto
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Prueba en papel v4.2
        run: python -m app.paper_forward
      - name: Avisar con un issue
        if: always() && hashFiles('data/paper/notify.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "import json;d=json.load(open('data/paper/notify.json'));open('/tmp/t','w').write(d['title']);open('/tmp/b','w').write(d['body'])"
          gh issue create --title "$(cat /tmp/t)" --body-file /tmp/b || echo "no se pudo abrir el issue"
      - name: Guardar en la rama v4.2-contexto
        if: always()
        run: |
          git config user.name "cryptoagent-paper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paper
          git diff --cached --quiet && exit 0
          git commit -q -m "papel v4.2: $(date -u +%FT%TZ) [skip render]"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs origin v4.2-contexto && git push -q origin HEAD:v4.2-contexto && exit 0
            git rebase --abort 2>/dev/null; sleep $((i * 15))
          done
          echo "no se pudo empujar después de 3 intentos"; exit 1
