# Estudio de rebotes de corto plazo (pre-registro: docs/REBOTES.md).
# [rb-run] en el mensaje del commit (o a mano): universo Russell 3000 + velas diarias desde 2005 (caché semanal) →
# backtest → resultados en la rama rebotes-data.
name: rebotes
on:
  workflow_dispatch:
  push:
    branches: [rebotes]
permissions:
  contents: write
concurrency:
  group: rebotes
  cancel-in-progress: false
jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[rb-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q "yfinance>=0.2.54" pandas numpy httpx
      - id: wk
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: store
          key: rb-panel-${{ steps.wk.outputs.week }}
      - name: Universo y precios (si no hay caché de esta semana)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p store
          python -m rebotes.data universe store
          python -m rebotes.data prices store
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: store
          key: rb-panel-${{ steps.wk.outputs.week }}
      - run: cat store/universe.json store/prices.json | head -c 2000
      - run: python -m rebotes.backtest store/panel.npz out/results
      - name: Publicar
        env: { TOKEN: "${{ github.token }}" }
        run: |
          cp store/universe.txt store/universe.json store/prices.json out/results/ 2>/dev/null || true
          bash .github/scripts/rb_store_push.sh out "rebotes-data - resultados $(date -u +%FT%TZ)"
