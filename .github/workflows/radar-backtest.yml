# Radar EB (agente 2, solo alertas): validación fuera de muestra con datos reales. Corre al empujar cambios del
# modelo a la rama radar-eb y una vez al mes (el cron vive en main). No opera nada; no usa llaves de exchange.
name: radar-backtest
on:
  workflow_dispatch:
  schedule:
    - cron: "29 4 3 * *"
permissions:
  contents: write
concurrency:
  group: radar-backtest
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4.2-contexto
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r radar/requirements.txt
      - name: Pruebas sin red
        run: python -m tests.test_radar
      - name: Clave de caché (cada 6 h)
        id: ck
        run: echo "k=radar-cache-v2-$(date -u +%Y%m%d)-$(( $(date -u +%H) / 6 ))" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: .cache/radar
          key: ${{ steps.ck.outputs.k }}
          restore-keys: radar-cache-v2-
      - name: Validación fuera de muestra
        run: python -m radar backtest
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/radar
          key: ${{ steps.ck.outputs.k }}-bt-${{ github.run_id }}
      - name: Guardar en la rama v4.2-contexto
        if: always()
        run: |
          git config user.name "radar-eb-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radar/BACKTEST.md data/radar/backtest.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "radar: validación fuera de muestra $(date -u +%FT%TZ) [skip render]"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs origin v4.2-contexto && git push -q origin HEAD:v4.2-contexto && exit 0
            git rebase --abort 2>/dev/null; sleep $((i * 15))
          done
          echo "no se pudo empujar"; exit 1
