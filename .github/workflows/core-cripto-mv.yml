# Modelo multivariable de cripto (análogos, logística validada, cuantiles, betas). Corre con [criptomv-run].
name: core-cripto-mv
on:
  workflow_dispatch:
  push:
    branches: [rebotes]
permissions:
  contents: write
concurrency:
  group: core-cripto-mv
  cancel-in-progress: false
jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[criptomv-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q "yfinance>=0.2.54" pandas numpy requests scikit-learn
      - run: python -m core.cripto_mv out/cripto_mv
      - name: Publicar
        run: bash .github/scripts/rb_store_push.sh out "cripto_mv - $(date -u +%FT%TZ)"
