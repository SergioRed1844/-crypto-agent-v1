# Respaldo del cron de GitHub (que puede tardar horas en arrancar o saltarse corridas): dispara cada hora
# la prueba en papel y el vigía de contexto, y al terminar (~5 h) se relanza a sí mismo. Repo público:
# los minutos de Actions no cuestan. Solo dispara workflows de datos; no opera nada.
name: heartbeat
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/heartbeat.yml"]
permissions:
  actions: write
  contents: read
concurrency:
  group: heartbeat
  cancel-in-progress: false
jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Disparar cada hora
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for i in 1 2 3 4 5; do
            gh workflow run forward-test.yml --ref main || echo "forward-test no disponible"
            gh workflow run context-watch.yml --ref main || echo "context-watch no disponible"
            [ "$i" -lt 5 ] && sleep 3540
          done
      - name: Relevo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run heartbeat.yml --ref main
