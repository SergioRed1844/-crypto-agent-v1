# Respaldo del cron de GitHub (que puede tardar horas en arrancar o saltarse corridas): dispara cada hora
# el vigía de contexto, la prueba en papel v4.2 y el Radar EB (agente 2, solo alertas), y al terminar (~5 h) se relanza a sí mismo. Repo público:
# los minutos de Actions no cuestan. Solo dispara workflows de datos; no opera nada.
name: heartbeat
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/heartbeat.yml"]
permissions:
  actions: write
  contents: read
concurrency:
  group: heartbeat
  cancel-in-progress: false
jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Disparar cada hora
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for i in 1 2 3 4 5; do
            gh workflow run context-watch.yml --ref main || echo "context-watch no disponible"
            gh workflow run paper-v42.yml --ref main || echo "paper-v42 no disponible"
            gh workflow run radar-scan.yml --ref main || echo "radar-scan no disponible"
            if [ "$i" -lt 5 ]; then sleep 3540; fi
          done
      - name: Relevo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run heartbeat.yml --ref main
