# Estrategia B (carry + momentum): backtest pre-registrado → data/fx/{CARRY_BACKTEST.md, carry_backtest.json}.
# Corre con [fx-carry-bt] en el mensaje, al terminar fx-carry-data o a mano.
name: fx-carry-backtest
on:
  workflow_dispatch:
  push:
    branches: [fx-agente]
permissions:
  contents: write
concurrency:
  group: fx-carry-backtest
  cancel-in-progress: false
jobs:
  run:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[fx-carry-bt]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fx-agente
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r fx/requirements.txt
      - name: Pruebas
        run: |
          python -m tests.test_fx_carry > /tmp/t.txt 2>&1 || true
          grep -v "^✔" /tmp/t.txt | tail -10
          tail -1 /tmp/t.txt | grep -q " OK$"
      - name: Datos
        run: |
          git fetch -q --depth 1 origin fx-data
          git archive FETCH_HEAD carry | tar -x
      - run: python -m fx.carry.backtest carry data/fx
      - name: Publicar
        run: |
          git config user.name "fx-agente-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fx/CARRY_BACKTEST.md data/fx/carry_backtest.json
          git diff --cached --quiet && exit 0
          git commit -q -m "fx: backtest carry $(date -u +%FT%TZ) [skip render] [no-bt]"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs origin fx-agente && git push -q origin HEAD:fx-agente && exit 0
            git rebase --abort 2>/dev/null; sleep $((i * 15))
          done
          exit 1
