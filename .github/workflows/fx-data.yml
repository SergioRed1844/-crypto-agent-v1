# Agente FX: descarga velas de 1 minuto bid/ask de Dukascopy (2015 → ayer) y las guarda en la rama `fx-data`.
# Se dispara con un push a fx-agente cuyo mensaje lleve [fx-probe] (sonda rápida) o [fx-data] (descarga completa),
# o a mano desde Actions. El espacio de trabajo de Claude no alcanza Dukascopy; GitHub Actions sí.
name: fx-data
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Años a bajar (JSON), p. ej. [2026]"
        default: "[2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026]"
  push:
    branches: [fx-agente]
permissions:
  contents: write
  actions: write
concurrency:
  group: fx-data
  cancel-in-progress: false
jobs:
  probe:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[fx-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy httpx
      - run: |
          mkdir -p out
          python -m fx.data_dukascopy probe out > out/probe.log 2>&1 || echo "PROBE_FAIL=1" >> "$GITHUB_ENV"
          cat out/probe.log
      - name: Publicar sonda en fx-data
        env: { TOKEN: "${{ github.token }}" }
        run: |
          bash .github/scripts/fx_store_push.sh out "fx-data - sonda $(date -u +%FT%TZ)"
          test -z "$PROBE_FAIL"

  bars:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[fx-data]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        sym: [EURUSD, GBPUSD, USDJPY, USDCHF, USDMXN]
        year: ${{ fromJSON(github.event.inputs.years || '[2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy httpx
      - name: Descargar y reintentar días fallidos
        run: |
          python -m fx.data_dukascopy year ${{ matrix.sym }} ${{ matrix.year }} out || echo "con fallas: reparo"
          python -m fx.data_dukascopy repair ${{ matrix.sym }} ${{ matrix.year }} out out2
          mv out2/* out/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bars-${{ matrix.sym }}-${{ matrix.year }}
          path: out/
          retention-days: 3
          if-no-files-found: ignore

  repair:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[fx-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        sym: [EURUSD, GBPUSD, USDJPY, USDCHF, USDMXN]
        year: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy httpx
      - name: Bajar lo que ya hay en fx-data
        run: |
          mkdir -p src
          git fetch -q --depth 1 origin fx-data && \
            git show FETCH_HEAD:bars/${{ matrix.sym }}_${{ matrix.year }}.npz.xz > src/${{ matrix.sym }}_${{ matrix.year }}.npz.xz || rm -f src/*
      - run: python -m fx.data_dukascopy repair ${{ matrix.sym }} ${{ matrix.year }} src out
      - uses: actions/upload-artifact@v4
        with:
          name: bars-${{ matrix.sym }}-${{ matrix.year }}
          path: out/
          retention-days: 3

  collect:
    needs: [bars, repair]
    if: always() && (needs.bars.result != 'skipped' || needs.repair.result != 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy httpx
      - name: Lo ya publicado
        run: |
          mkdir -p old new out/bars
          if git fetch -q --depth 1 origin fx-data; then
            git archive FETCH_HEAD bars | tar -x -C old 2>/dev/null || true
          fi
          mkdir -p old/bars
      - uses: actions/download-artifact@v4
        with:
          pattern: bars-*
          merge-multiple: true
          path: new
      - name: Unir minuto a minuto (nunca se pierde un día ya bueno)
        run: |
          python -m fx.data_dukascopy merge old/bars new out/bars
          cp new/*.json out/bars/ 2>/dev/null || true
          for f in old/bars/*; do b=$(basename "$f"); [ -e "out/bars/$b" ] || cp "$f" out/bars/; done
      - name: Manifiesto y cobertura
        run: |
          python - <<'EOF'
          import json, glob
          rows = [json.load(open(p)) for p in sorted(glob.glob("out/bars/*.json"))]
          json.dump(rows, open("out/MANIFEST.json", "w"), indent=1)
          bad = [r for r in rows if not r["scale"]["ok"] or r["days_failed"] > 0]
          print(len(rows), "archivos;", len(bad), "con días fallidos o escala mala")
          for r in bad: print(r["sym"], r["year"], r["scale"], r["days_failed"], r["fails"][:3])
          EOF
          python -m fx.data_dukascopy coverage out/bars | tee out/COVERAGE.txt
      - name: Publicar en fx-data
        env: { TOKEN: "${{ github.token }}" }
        run: |
          bash .github/scripts/fx_store_push.sh out "fx-data - velas $(date -u +%FT%TZ)"
      - name: Recalcular backtest y modelo
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run fx-backtest.yml --ref fx-agente -R "$GITHUB_REPOSITORY" || echo "no se pudo despachar"
