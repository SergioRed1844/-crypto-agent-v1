# Busca una cripto por nombre (CoinGecko + Bitso). Corre con [buscar-run].
name: core-buscar
on:
  workflow_dispatch:
  push:
    branches: [rebotes]
permissions:
  contents: write
concurrency:
  group: core-buscar
  cancel-in-progress: false
jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[buscar-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pandas numpy requests
      - run: python -m core.buscar_cripto out/buscar dodo
      - name: Publicar
        run: bash .github/scripts/rb_store_push.sh out "buscar - $(date -u +%FT%TZ)"
