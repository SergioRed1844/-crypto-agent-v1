# Empresas en mínimos de 52 semanas y 5 años para las reglas CORE. Corre con [minimos-run] en el mensaje del commit.
name: core-minimos
on:
  workflow_dispatch:
  push:
    branches: [rebotes]
permissions:
  contents: write
concurrency:
  group: core-minimos
  cancel-in-progress: false
jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[minimos-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q "yfinance>=0.2.54" pandas numpy lxml requests
      - run: python -m core.minimos out/minimos
      - name: Publicar
        run: bash .github/scripts/rb_store_push.sh out "minimos - $(date -u +%FT%TZ)"
