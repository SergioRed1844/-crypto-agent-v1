# Memecoins y altcoins de alto riesgo disponibles en Bitso (CoinGecko). Corre con [memes-run].
name: core-memes
on:
  workflow_dispatch:
  push:
    branches: [rebotes]
permissions:
  contents: write
concurrency:
  group: core-memes
  cancel-in-progress: false
jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[memes-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pandas numpy requests
      - run: python -m core.memes out/memes
      - name: Publicar
        run: bash .github/scripts/rb_store_push.sh out "memes - $(date -u +%FT%TZ)"
