# Estudio de OPIs récord vs normales + SPCX/ANT/TSLA. Corre con [opis-run].
name: core-opis
on:
  workflow_dispatch:
  push:
    branches: [rebotes]
permissions:
  contents: write
concurrency:
  group: core-opis
  cancel-in-progress: false
jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[opis-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q "yfinance>=0.2.54" pandas numpy
      - run: python -m core.opis out/opis
      - name: Publicar
        run: bash .github/scripts/rb_store_push.sh out "opis - $(date -u +%FT%TZ)"
