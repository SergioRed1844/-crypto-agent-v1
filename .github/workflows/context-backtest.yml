# Estudio de eventos (pesos por categoría desde 2010) + backtest de variantes v4.2 con datos reales de Binance.
# Mensual (día 2) o a mano / con un push que diga [backtest]. Solo datos: no opera nada.
name: context-backtest
on:
  schedule:
    - cron: "47 3 2 * *"
  workflow_dispatch:
  push:
    branches: [v4.2-contexto]
permissions:
  contents: write
concurrency:
  group: context-backtest
  cancel-in-progress: false
jobs:
  backtest:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[backtest]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4.2-contexto
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Historia de precios, funding y Fear & Greed
        run: python tools/fetch_history.py --out datos --since 2020-03-01
      - name: Estudio de eventos (BTC desde 2010)
        run: python -m app.context.event_study --fetch
      - name: Backtest de variantes v4.2
        run: python tools/backtest_variants.py --csv-dir datos --since 2021-01-01
      - name: Guardar en la rama v4.2-contexto (aunque un paso anterior haya fallado)
        if: always()
        run: |
          git config user.name "cryptoagent-context-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/context
          git diff --cached --quiet && exit 0
          git commit -q -m "contexto: estudio de eventos + backtest v4.2 $(date -u +%F) [skip render]"
          for i in 1 2 3; do
            # si otro job empujó datos, gana lo de esta corrida (-X theirs en un rebase = los commits locales)
            git pull -q --rebase -X theirs origin v4.2-contexto && git push -q origin HEAD:v4.2-contexto && exit 0
            git rebase --abort 2>/dev/null; sleep $((i * 15))
          done
          echo "no se pudo empujar después de 3 intentos"; exit 1
