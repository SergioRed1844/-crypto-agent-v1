# ¿Piso en cripto? Medidas de piso y análogos históricos (BTC, ETH, DOGE). Corre con [cripto-run].
name: core-cripto
on:
  workflow_dispatch:
  push:
    branches: [rebotes]
permissions:
  contents: write
concurrency:
  group: core-cripto
  cancel-in-progress: false
jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[cripto-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q "yfinance>=0.2.54" pandas numpy lxml requests
      - run: python -m core.cripto out/cripto
      - name: Publicar
        run: bash .github/scripts/rb_store_push.sh out "cripto - $(date -u +%FT%TZ)"
